<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - Rajmachi Campsite</title>
  <link rel="stylesheet" href="contact.css" />
  <script src="https://unpkg.com/scrollreveal"></script>
</head>
<body>

<a href="index.htm" class="global-back-home-btn">← Home</a>


  <section class="contact-hero">
    <h1>Contact Rajmachi Campsite</h1>
    <p>Reach out to us for bookings, queries, or just to say hello 🌿</p>
  </section>

  <section class="contact-info">
    <div class="contact-box">
      <h2>📞 Call Us</h2>
      <p><a href="tel:+919158413493">+919158413493</a></p>
    </div>
    <div class="contact-box">
      <h2>💬 WhatsApp</h2>
      <p><a href="https://wa.me/919158413493" target="_blank">Chat with us</a></p>
    </div>
    <div class="contact-box">
      <h2>📧 Email</h2>
      <p><a href="mailto:subhashware.27@gmail.com">subhashware.27@gmail.com</a></p>
    </div>
  </section>

  <section class="contact-form">
    <h2>Send Us a Message</h2>
    <form>
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <input type="tel" placeholder="Your Phone" />
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Submit</button>
    </form>
  </section>

  <section class="contact-map">
    <h2>Find Us on the Map</h2>
    <iframe 
      src="https://www.google.com/maps?q=Rajmachi&output=embed"
      frameborder="0"
      allowfullscreen=""
      loading="lazy"
    ></iframe>
  </section>

  <script src="contact.js"></script>
</body>
</html>
